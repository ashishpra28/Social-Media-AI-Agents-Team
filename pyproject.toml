[project]
name = "socialmedia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashish Prajapati", email = "aknexa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
    "tavily>=1.1.0",
]

[project.scripts]
socialmedia = "socialmedia:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
